name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-release-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-release-

      - name: Set up Java 8 (Temurin) for 1.8.9 Forge
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Make Wrappers Executable
        run: chmod +x gradlew modern/gradlew

      - name: Build MC 1.8.9 Forge Production Jar
        run: ./gradlew setupCiWorkspace clean build --no-daemon --stacktrace

      - name: Set up Java 25 (Temurin) for 26.3 Fabric
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build MC 26.3 Fabric Production Jar
        working-directory: modern
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Stage Release Assets
        run: |
          mkdir -p dist
          for f in build/libs/Cigarette-V1-*.jar; do
            base=$(basename "$f" .jar)
            cp "$f" "dist/${base}-mc1.8.9-forge.jar"
          done
          cp modern/build/libs/Cigarette-V1-*-fabric.jar dist/
          ls -la dist/

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "Cigarette V1 ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.jar
          body: |
            # Cigarette V1 — Production Release `${{ github.ref_name }}`

            High-Performance Open-Source Hybrid Ghost & Utility Client modeled after Vape V4.

            ### Downloads
            - **`Cigarette-V1-*-mc1.8.9-forge.jar`** — Legacy PvP Edition for **Minecraft 1.8.9 (Forge 11.15.1.2318)** on Java 8 (also works on `1.7`–`26.x` servers when paired with **ViaForge 4.4.0+4+1.8.9**).
            - **`Cigarette-V1-*-mc26.3-fabric.jar`** — Modern Native Edition for **Minecraft 26.3 (Fabric Loader 0.20.1+ & Fabric API)** on Java 25 (also works on `1.8`–`26.2` servers when paired with **ViaFabricPlus**).

            ### Highlights
            - **Vape V4 Replica UI:** `#141416` dark aesthetic, draggable multi-panel ClickGUI (`Right Shift`), scissor-clipped drawers, Profiles, Search, HUD Editor, and custom accent themes
            - **Ghost, Blatant & Utility Suite:** 41 modules across Combat, Blatant, Utility, Render, and Client categories with JSON profile persistence (`.minecraft/cigarette/profiles/` and `.minecraft/Cigarette/profiles/`)
            - **Works on Official & Offline/Cracked Launchers:** Official Launcher, Prism Launcher, MultiMC, TLauncher, SKLauncher

            ---
            *Crafted by [taezeem14](https://github.com/taezeem14) (Muhammad Taezeem Tariq).*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
