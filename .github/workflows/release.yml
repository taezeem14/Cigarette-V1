name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-release-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-release-

      - name: Set up Java 8 (Zulu) for 1.8.9 Forge
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Make Wrappers Executable
        run: chmod +x gradlew modern/gradlew

      - name: Build MC 1.8.9 Forge Production Jar
        run: ./gradlew setupCiWorkspace clean build --no-daemon --stacktrace

      - name: Set up Java 25 (Temurin) for 26.3 Fabric
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build MC 26.3 Fabric Production Jar
        working-directory: modern
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Stage Release Assets
        run: |
          mkdir -p dist
          for f in build/libs/Cigarette-V1-*.jar; do
            base=$(basename "$f" .jar)
            cp "$f" "dist/${base}-mc1.8.9-forge.jar"
          done
          cp modern/build/libs/Cigarette-V1-*-fabric.jar dist/
          ls -la dist/

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "Cigarette V1 ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.jar
          body: |
            # Cigarette V1 — Production Release `${{ github.ref_name }}`

            High-Performance Open-Source Hybrid & Utility Client for **Minecraft 1.8.x – 26.x**.

            ### Downloads
            - **`Cigarette-V1-*-mc1.8.9-forge.jar`** — Classic Forge Edition for **Minecraft 1.8.x / 1.8.9** on Java 8 (joins **every server `1.8` – `1.21.x` – `26.x`** via **ViaForge** + 1-click installer inside the Desktop Launcher GUI!).
            - **`Cigarette-V1-*-mc26.3-fabric.jar`** — Modern Fabric Edition for **Minecraft 1.21+ / 26.3** on Java 25 (joins **every server `1.8` – `26.x`** via **ViaFabricPlus**).

            ### Highlights
            - **Cigarette V1 Signature UI:** Sleek `#141418` 2-column ClickGUI (`Right Shift`), live cross-category search bar, auto-fit viewport scaling, 3-dot module drawers with trackpad-friendly keybinds, HUD Editor, Keystrokes, ArmorHUD, and 7 custom accent presets
            - **Modernized Desktop Launcher & Companion GUI:** Double-click either JAR to launch the dark rounded companion app with SystemTray background mode, 1-click Launcher starter, 1-click ViaForge/ViaFabricPlus multi-version installer, and real interactive module slider/mode/keybind sync
            - **47 Real Working Modules Across All 6 Categories:** Combat (10), Blatant (10), Render (12), Utility (5), World (7), and Client (3) — tested across Singleplayer, Multiplayer, OptiFine, and `1.9+` Cooldown servers

            ---
            *Crafted by [taezeem14](https://github.com/taezeem14) (Muhammad Taezeem Tariq).*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
